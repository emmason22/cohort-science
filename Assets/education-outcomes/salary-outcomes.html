const OLD_COLOR = "#B8C4D6";
const MAX_YSG = 10;
const LABELS = Array.from({length: MAX_YSG+1}, (_, i) => "Year " + i);

let mode = "abs";
let showAll = true;
let selectedCohorts = new Set(NEW_YEARS);

const ALL_COHORTS = [...NEW_YEARS, ...OLD_YEARS]
  .filter(y => DATA_NEW[y] || DATA_OLD[y])
  .sort((a,b) => a-b);

function getCohortData(y){ return DATA_NEW[y] || DATA_OLD[y]; }
function isOldYear(y){ return OLD_YEARS.includes(y); }

function indexSeries(rawSeries){
  let baseIdx = -1;
  for (let i=0; i<rawSeries.length; i++) {
    if (rawSeries[i] != null) { baseIdx = i; break; }
  }
  if (baseIdx < 0) return rawSeries.map(()=>null);
  const base = rawSeries[baseIdx];
  return rawSeries.map(v => v != null ? Math.round(v/base*1000)/10 : null);
}

function buildCohortDataset(y){
  const cd = getCohortData(y);
  if (!cd) return null;
  const raw = LABELS.map((_, ysg) => cd.by_year[ysg]?.mean ?? null);
  const ns  = LABELS.map((_, ysg) => cd.by_year[ysg]?.n ?? 0);
  const data = mode === "abs" ? raw.map(v => v != null ? v/1000 : null) : indexSeries(raw);
  const color = isOldYear(y) ? OLD_COLOR : (COHORT_COLORS[y] || "#5A7090");
  return {
    label: `${y} Grads (n=${cd.total_n})`,
    _cohortLabel: `${y} Grads`,
    _color: color,
    data, _raw: raw, _ns: ns, _y: y,
    borderColor: color, backgroundColor: color + "22",
    borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
    tension: 0.35, fill: false, spanGaps: false,
    pointBackgroundColor: color, pointBorderColor: color,
  };
}

function buildOverallDataset(){
  const raw = LABELS.map((_, ysg) => DATA_OVERALL[ysg]?.mean ?? null);
  const ns  = LABELS.map((_, ysg) => DATA_OVERALL[ysg]?.n ?? 0);
  const data = mode === "abs" ? raw.map(v => v != null ? v/1000 : null) : indexSeries(raw);
  const overallTotalN = DATA_OVERALL[0]?.n ?? 0;
  return {
    label: `Overall Avg (n=${overallTotalN})`,
    _cohortLabel: "Overall Avg",
    _color: "#1A2B45",
    data, _raw: raw, _ns: ns, _y: null,
    borderColor: "#1A2B45", backgroundColor: "transparent",
    borderWidth: 3, borderDash: [6, 4],
    pointRadius: 5, pointHoverRadius: 7, tension: 0.35, fill: false, spanGaps: false,
    pointBackgroundColor: "#1A2B45", pointBorderColor: "#1A2B45",
  };
}

function getActiveCohorts(){
  if (showAll) return [...NEW_YEARS].filter(y => DATA_NEW[y]);
  return [...selectedCohorts].sort((a,b)=>a-b);
}

function buildAllDatasets(){
  const list = getActiveCohorts().map(y => buildCohortDataset(y)).filter(Boolean);
  list.push(buildOverallDataset());
  return list;
}

const ctx = document.getElementById("chartSal").getContext("2d");
const reduceChartMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let previousAxisMode = mode;
const chart = new Chart(ctx, {
  type: "line",
  data: { labels: LABELS, datasets: buildAllDatasets() },
  options: {
    responsive: true, maintainAspectRatio: false, animation: {duration: reduceChartMotion.matches ? 0 : 400},
    plugins: {
      legend: {display:false},
      tooltip: {
        displayColors: true,
        callbacks: {
          title: (items) => {
            const ds = items[0].dataset;
            return `${ds._cohortLabel} · ${items[0].label}`;
          },
          labelColor: (ctx) => ({borderColor: ctx.dataset._color, backgroundColor: ctx.dataset._color}),
          label: (ctx) => {
            const ds = ctx.dataset;
            const i = ctx.dataIndex;
            const raw = ds._raw[i];
            const n = ds._ns[i];
            if (raw == null) return ` no data`;
            const dollar = "$" + (raw/1000).toFixed(0) + "K";
            if (mode === "abs") return ` ${dollar} (n=${n})`;
            return ` ${ctx.parsed.y.toFixed(1)} index (≈${dollar}, n=${n})`;
          }
        }
      }
    },
    scales: {
      x: {grid:{display:false}, ticks:{font:{size:12,weight:"600"}, color:"#1A2B45"}, title:{display:true, text:"Year/s after Graduation", font:{size:11}, color:"#5A7090"}},
      y: {
        grid:{color:"#DDE3EC"},
        ticks:{font:{size:11}, color:"#5A7090", callback: v => mode === "abs" ? "$" + v + "K" : v},
        title:{display:true, text: mode === "abs" ? "Avg Salary (USD)" : "Index (Year 0 = 100)",
                font:{size:11}, color:"#5A7090"}
      }
    }
  }
});

function rebuild(){
  const datasets = buildAllDatasets();
  const y = chart.scales.y;
  const values = datasets.flatMap(dataset => dataset.data).filter(Number.isFinite);
  const fits = mode === previousAxisMode && y && values.every(value => value >= y.min && value <= y.max);
  chart.options.scales.y.min = fits ? y.min : undefined;
  chart.options.scales.y.max = fits ? y.max : undefined;
  previousAxisMode = mode;
  chart.data.datasets = datasets;
  chart.options.scales.y.title.text = mode === "abs" ? "Avg Salary (USD)" : "Index (Year 0 = 100)";
  chart.options.scales.y.ticks.callback = v => mode === "abs" ? "$" + v + "K" : v;
  document.getElementById("subtitle").textContent =
    mode === "abs" ? "Mean salary at Year 0, 1, 2 … after graduating"
                   : "Indexed to 100 at Year 0 · tooltip shows implied $ amount";
  chart.update(reduceChartMotion.matches ? "none" : undefined);
  rebuildLegend();
  updateCohortBtnLabel();
}

function setMode(m){
  mode = m;
  document.getElementById("absBtn").classList.toggle("active", m === "abs");
  document.getElementById("idxBtn").classList.toggle("active", m === "idx");
  rebuild();
}
document.getElementById("absBtn").onclick = () => setMode("abs");
document.getElementById("idxBtn").onclick = () => setMode("idx");

document.getElementById("showAllBtn").onclick = () => {
  showAll = !showAll;
  document.getElementById("showAllBtn").classList.toggle("active", showAll);
  document.getElementById("cohortWrap").style.display = showAll ? "none" : "inline-block";
  rebuild();
};

function updateCohortBtnLabel(){
  const n = selectedCohorts.size;
  document.getElementById("cohortBtn").textContent =
    n === 0 ? "No Cohorts ▾" : (n === 1 ? `1 Cohort Selected ▾` : `${n} Cohorts Selected ▾`);
}

const cohortItemsContainer = document.getElementById("cohortItems");
ALL_COHORTS.forEach(y => {
  const cd = getCohortData(y);
  if (!cd) return;
  const item = document.createElement("div");
  item.className = "multi-item";
  const checked = selectedCohorts.has(y) ? "checked" : "";
  const color = isOldYear(y) ? OLD_COLOR : (COHORT_COLORS[y] || "#5A7090");
  item.innerHTML = `<input type="checkbox" id="chk_${y}" ${checked}>
    <span class="dot-swatch" style="background:${color}"></span>
    <label for="chk_${y}" style="cursor:pointer;flex:1;">${y} Grads (n=${cd.total_n})</label>`;
  cohortItemsContainer.appendChild(item);
  item.querySelector("input").onchange = (e) => {
    if (e.target.checked) selectedCohorts.add(y); else selectedCohorts.delete(y);
    rebuild();
  };
});
document.getElementById("selAll").onclick = () => {
  ALL_COHORTS.forEach(y => { if (getCohortData(y)) selectedCohorts.add(y); });
  document.querySelectorAll("#cohortItems input").forEach(cb => cb.checked = true);
  rebuild();
};
document.getElementById("selNone").onclick = () => {
  selectedCohorts.clear();
  document.querySelectorAll("#cohortItems input").forEach(cb => cb.checked = false);
  rebuild();
};
document.getElementById("cohortBtn").onclick = (e) => {
  e.stopPropagation();
  document.getElementById("cohortDrop").classList.toggle("open");
};
document.addEventListener("click", () => document.getElementById("cohortDrop").classList.remove("open"));
document.getElementById("cohortDrop").onclick = (e) => e.stopPropagation();

function rebuildLegend(){
  const lg = document.getElementById("legend");
  lg.innerHTML = "";
  chart.data.datasets.forEach((ds, di) => {
    const el = document.createElement("div");
    el.className = "legend-item";
    const dashed = ds._y == null ? " dashed" : "";
    el.innerHTML = `<span class="legend-line${dashed}" style="background-color:${ds.borderColor};color:${ds.borderColor};"></span>${ds.label}`;
    el.onclick = () => {
      const meta = chart.getDatasetMeta(di);
      meta.hidden = !meta.hidden;
      el.classList.toggle("disabled", meta.hidden);
      chart.update(reduceChartMotion.matches ? "none" : undefined);
    };
    lg.appendChild(el);
  });
}
setMode("idx");
</script>
